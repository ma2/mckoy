name = "mckoy-api"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "mckoy_db"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[vars]
RP_ID = "localhost"
RP_NAME = "Mckoy"
RP_ORIGIN = "http://localhost:5173"
SESSION_COOKIE_SECURE = "false"

# Production deploy: `npm run build --workspace apps/web` first, then
# `wrangler deploy --env production` from apps/api. Serves the built SPA and
# the API from the same Worker/origin, so no CORS or cross-site cookie config
# is needed (same pattern as the Vite dev proxy).
[env.production]
name = "mckoy-api"

[env.production.vars]
RP_ID = "mckoy-api.mckoy.workers.dev"
RP_NAME = "Mckoy"
RP_ORIGIN = "https://mckoy-api.mckoy.workers.dev"
SESSION_COOKIE_SECURE = "true"

[[env.production.d1_databases]]
binding = "DB"
database_name = "mckoy_db"
database_id = "19ef9e59-ba28-46b9-9f3c-88849c578464"
migrations_dir = "migrations"

[env.production.assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# ステージング環境: dev ブランチの内容を master へマージする前に実際に動かして確認する
# ためのデプロイ先（仕様書 §3「デプロイ環境」）。本番とは別のWorker・D1データベース・
# WebAuthnオリジンを使う（パスキーはオリジンに紐づくため本番と共有できない）。デプロイは
# 自動化せず、必要な時に `wrangler deploy --env staging` で手動実行する。
[env.staging]
name = "mckoy-api-staging"

[env.staging.vars]
RP_ID = "mckoy-api-staging.mckoy.workers.dev"
RP_NAME = "Mckoy (Staging)"
RP_ORIGIN = "https://mckoy-api-staging.mckoy.workers.dev"
SESSION_COOKIE_SECURE = "true"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "mckoy_db_staging"
database_id = "e3780f3e-bb6a-44dd-b472-9413dfaea6f3"
migrations_dir = "migrations"

[env.staging.assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]
