name: D1 バックアップ

# 本番D1(mckoy_db)を定期的にSQLダンプとしてエクスポートし、GitHub Actions artifactとして
# Cloudflareの外に保持する（仕様書 §19「バックアップ」）。復元手順は MCKOY_SPEC.md §19 を参照。

on:
  schedule:
    - cron: '0 18 * * *' # 毎日 UTC 18:00 (JST 03:00)
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 依存関係インストール
        run: npm ci

      - name: D1をSQLファイルにエクスポート
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 export mckoy_db --env production --remote --output=mckoy-db-backup.sql -y

      - uses: actions/upload-artifact@v4
        with:
          name: mckoy-db-backup-${{ github.run_id }}
          path: apps/api/mckoy-db-backup.sql
          retention-days: 90
