name: 本番デプロイ

# master への push（＝PRのマージ）ごとに、本番環境（wrangler.toml の
# [env.production]、仕様書 §3「デプロイ環境」）へデプロイする。
# 順序は「① D1 マイグレーション適用 → ②（成功時のみ）Worker デプロイ」に固定する。
# マイグレーションは「追記のみ」（CLAUDE.md）で後方互換なので、①と②の間に旧コードが
# 新スキーマに当たっても壊れない（expandパターン）。①が失敗したら②は実行しない。
# スキーマ変更は PR diff の migrations/000N_*.sql でマージ前にレビューでき、
# PR作成時点で staging（deploy-staging.yml）に同じ適用・動作確認が済んでいる。
#
# 手動で流したい場合は workflow_dispatch。
#
# 必要なリポジトリ secret（d1-backup.yml / deploy-staging.yml と共用）:
#   CLOUDFLARE_API_TOKEN  … Workers Scripts:Edit / D1:Edit / Account Settings:Read を含むこと
#   CLOUDFLARE_ACCOUNT_ID

on:
  push:
    branches: [master]
  workflow_dispatch: {}

# 本番デプロイは進行中のものを止めない（中途半端な状態を避ける）。
# 連続マージ時は順番に流す。
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 依存関係インストール
        run: npm ci

      - name: Web をビルド
        run: npm run build --workspace apps/web

      - name: 本番 D1 に migration を適用
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # CI（非対話環境）では確認プロンプトは自動でスキップされ、適用前に
        # D1 側で自動バックアップが取られる。`d1 migrations apply` は `-y` 非対応。
        run: npx wrangler d1 migrations apply mckoy_db --env production --remote

      - name: 本番へデプロイ
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env production
